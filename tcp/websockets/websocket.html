<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOSZILLA: WebSocket</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0d1b2a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      gap: 24px;
    }

    h1 {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #90caf9;
      text-shadow: 0 0 20px rgba(144, 202, 249, 0.3);
      margin: 0;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 8px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
      color: #fff;
    }

    button:hover:not(:disabled) { opacity: 0.85; }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #startButton { background: #1565c0; }
    #stopButton  { background: #0d47a1; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 340px;
    }

    .stat-box {
      background: #132338;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #1e3a5f;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #90caf9;
    }

    .stat-label {
      color: #64b5f6;
      margin-top: 5px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>WEBSOCKET</h1>

  <div class="buttons">
    <button id="startButton">Start</button>
    <button id="stopButton" disabled>Stop</button>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="opened">0</div>
      <div class="stat-label">Open</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="errors">0</div>
      <div class="stat-label">Errors</div>
    </div>
  </div>

  <script>
    //target connection number
    const NUM_CONNECTIONS = 300;

    const state = {
      sockets: [],
      opened: 0,
      errors: 0
    };

    const ui = {
      startButton: document.getElementById('startButton'),
      stopButton: document.getElementById('stopButton'),
      opened: document.getElementById('opened'),
      errors: document.getElementById('errors')
    };
    
    // build websocket url 
    function getWsUrl() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const port = location.port || (protocol === 'wss:' ? '443' : '80');
      return `${protocol}//${location.hostname}:${port}`;
    }

    function updateUI() {
      ui.opened.textContent = state.opened;
      ui.errors.textContent = state.errors;
      ui.stopButton.disabled = state.sockets.length === 0;
    }

    function openConnections() {
      const wsUrl = getWsUrl();

      for (let i = 0; i < NUM_CONNECTIONS; i++) {
        try {
          const ws = new WebSocket(wsUrl);

          ws.onopen = () => {
            state.opened++;
            updateUI();
          };

          ws.onerror = () => {
            state.errors++;
            updateUI();
          };

          ws.onclose = () => {
            state.opened = Math.max(0, state.opened - 1);
            updateUI();
          };

          state.sockets.push(ws);
        } catch (e) {
          console.error('WebSocket exception:', e);
          state.errors++;
        }
      }
      updateUI();
    }

    function stopAll() {
      state.sockets.forEach(ws => {
        try { ws.close(); } catch (e) {}
      });
      state.sockets = [];
      state.opened = 0;
      updateUI();
    }

    ui.startButton.onclick = openConnections;
    ui.stopButton.onclick = stopAll;
    updateUI();
  </script>
</body>
</html>
